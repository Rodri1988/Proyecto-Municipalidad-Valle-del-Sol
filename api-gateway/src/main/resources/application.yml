server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=0

        - id: reportes-service
          uri: lb://reportes-service
          predicates:
            - Path=/api/reportes/**
          filters:
            - StripPrefix=0

        - id: emergencias-service
          uri: lb://emergencias-service
          predicates:
            - Path=/api/emergencias/**
          filters:
            - StripPrefix=0

        - id: ubicacion-service
          uri: lb://ubicacion-service
          predicates:
            - Path=/api/ubicacion/**
          filters:
            - StripPrefix=0

        - id: notificaciones-service
          uri: lb://notificaciones-service
          predicates:
            - Path=/api/notificaciones/**
          filters:
            - StripPrefix=0

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true