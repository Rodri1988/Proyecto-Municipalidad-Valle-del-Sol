server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:
        - id: servicio-usuario
          uri: lb://servicio-usuario
          predicates:
            - Path=/api/usuarios/**
          filters:
            - StripPrefix=0

        - id: servicio-reporte
          uri: lb://servicio-reporte
          predicates:
            - Path=/api/reportes/**
          filters:
            - StripPrefix=0

        - id: servicio-emergencia
          uri: lb://servicio-emergencia
          predicates:
            - Path=/api/emergencias/**
          filters:
            - StripPrefix=0

        - id: servicio-ubicacion
          uri: lb://servicio-ubicacion
          predicates:
            - Path=/api/ubicacion/**
          filters:
            - StripPrefix=0

        - id: servicio-notificacion
          uri: lb://servicio-notificacion
          predicates:
            - Path=/api/notificaciones/**
          filters:
            - StripPrefix=0

        - id: servicio-recurso
          uri: lb://servicio-recurso
          predicates:
            - Path=/api/recursos/**
          filters:
            - StripPrefix=0

        - id: servicio-empleo
          uri: lb://servicio-empleo
          predicates:
            - Path=/api/empleos/**
          filters:
            - StripPrefix=0

        - id: servicio-media
          uri: lb://servicio-media
          predicates:
            - Path=/api/media/**
          filters:
            - StripPrefix=0

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health, info, gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true