<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420">
  <style>
    .box { fill:#f8f9fa; stroke:#333; stroke-width:1.5; rx:6; }
    .text { font-family: Arial, Helvetica, sans-serif; font-size:14px; fill:#111 }
    .title { font-weight:700 }
    .arrow { stroke:#555; stroke-width:1.6; fill:none; marker-end:url(#arrowhead) }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#555" />
    </marker>
  </defs>

  <!-- Frontend -->
  <rect x="40" y="30" width="180" height="60" class="box"/>
  <text x="130" y="55" class="text title" text-anchor="middle">Frontend</text>
  <text x="130" y="72" class="text" text-anchor="middle">React / Vite</text>

  <!-- API Gateway -->
  <rect x="300" y="20" width="200" height="70" class="box"/>
  <text x="400" y="45" class="text title" text-anchor="middle">API Gateway</text>
  <text x="400" y="62" class="text" text-anchor="middle">(Route + Auth)</text>

  <!-- Eureka -->
  <rect x="300" y="120" width="200" height="60" class="box"/>
  <text x="400" y="150" class="text title" text-anchor="middle">Eureka</text>
  <text x="400" y="167" class="text" text-anchor="middle">Service Registry</text>

  <!-- Microservices -->
  <rect x="560" y="10" width="220" height="80" class="box"/>
  <text x="670" y="35" class="text title" text-anchor="middle">Microservice A</text>
  <text x="670" y="52" class="text" text-anchor="middle">Business logic</text>

  <rect x="560" y="110" width="220" height="80" class="box"/>
  <text x="670" y="135" class="text title" text-anchor="middle">Microservice B</text>
  <text x="670" y="152" class="text" text-anchor="middle">Business logic</text>

  <!-- Databases -->
  <ellipse cx="670" cy="220" rx="90" ry="30" fill="#fff" stroke="#333"/>
  <text x="670" y="220" class="text" text-anchor="middle">Database A</text>

  <ellipse cx="670" cy="280" rx="90" ry="30" fill="#fff" stroke="#333"/>
  <text x="670" y="280" class="text" text-anchor="middle">Database B</text>

  <!-- Arrows -->
  <path d="M220 60 L300 60" class="arrow" />
  <path d="M500 55 L560 55" class="arrow" />
  <path d="M500 150 L560 150" class="arrow" />
  <path d="M680 90 L680 120" class="arrow" />
  <path d="M680 190 L680 220" class="arrow" />

  <!-- Registration arrows to Eureka -->
  <path d="M640 70 L520 140" class="arrow" />
  <path d="M640 170 L520 160" class="arrow" />

  <!-- Labels -->
  <text x="260" y="45" class="text">HTTP / REST</text>
  <text x="360" y="97" class="text">Service Discovery</text>

</svg>
